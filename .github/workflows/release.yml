name: Publish Pages
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.release.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Finalize
        env:
          ADD132: ${{ secrets.ADD132 }}
          BA3D36: ${{ secrets.BA3D36 }}
        run: |
          python3 -c "
          import sys, pathlib, os
          meta_a = os.environ.get('ADD132', '')
          meta_b = os.environ.get('BA3D36', '')
          page = pathlib.Path('index.html')
          src = page.read_text(encoding='utf-8')
          out = src
          if meta_a:
              out = out.replace('<!-- 686eb4a5fb586834 -->', meta_a)
          if meta_b:
              out = out.replace('<!-- 1d8d12f014154851ac5a82bda0eb13f73a460fc1dc37 -->', meta_b)
          if out == src and (meta_a or meta_b):
              sys.exit(1)
          if out != src:
              page.write_text(out, encoding='utf-8')
          "
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: release
        uses: actions/deploy-pages@v4
